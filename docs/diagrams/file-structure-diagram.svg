    <g transform="translate(395, 38)">
      <rect x="0" y="0" width="175" height="42" rx="5" fill="#FFFFFF" stroke="#8C7A6B" stroke-width="1.2" filter="url(#shadow-clean)"/>
      <text x="12" y="26" font-size="11.5" font-weight="700" fill="#3D2E24">src / middleware.ts</text>
    </g>

    <!-- .env.example -->
    <g transform="translate(585, 38)">
      <rect x="0" y="0" width="175" height="42" rx="5" fill="#FFFFFF" stroke="#8C7A6B" stroke-width="1.2" filter="url(#shadow-clean)"/>
      <text x="12" y="26" font-size="11.5" font-weight="700" fill="#3D2E24">.env.example</text>
