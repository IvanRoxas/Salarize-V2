    <text x="14" y="22" font-size="11.5" font-weight="600" fill="#1E3A24">prisma.ts</text>
  </g>
  <path d="M 530 239 L 530 250" stroke="#4D7C54" stroke-width="1.4"/>
  <g transform="translate(440, 250)">
    <rect x="0" y="0" width="180" height="34" rx="5" fill="#FFFFFF" stroke="#4D7C54" stroke-width="1.2" filter="url(#shadow-clean)"/>
    <text x="14" y="22" font-size="11.5" font-weight="600" fill="#1E3A24">security.ts</text>
  </g>
  <path d="M 530 284 L 530 295" stroke="#4D7C54" stroke-width="1.4"/>
  <g transform="translate(440, 295)">
