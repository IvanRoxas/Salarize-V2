<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="100%" height="100%" style="background:#FAF7F2; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow-clean" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="35" y="32" font-size="16" font-weight="700" fill="#3D2E24">5.2 File and Folder Structure</text>
  <text x="35" y="50" font-size="11.5" font-weight="500" fill="#8C7A6B">Salarize V2 Directory Architecture</text>

  <!-- ========================================== -->
  <!-- ROOT: salarize-v2 /                        -->
  <!-- ========================================== -->
  <g transform="translate(340, 70)">
    <rect x="0" y="0" width="180" height="40" rx="8" fill="#F5EBE0" stroke="#8C7A6B" stroke-width="2" filter="url(#shadow-clean)"/>
    <!-- Folder Icon -->
    <path d="M 16 14 L 23 14 L 26 17 L 36 17 L 36 26 L 16 26 Z" fill="#8C7A6B"/>
    <text x="46" y="25" font-size="13" font-weight="700" fill="#3D2E24">salarize-v2 /</text>
  </g>

  <!-- Trunk Lines to 4 Columns -->
