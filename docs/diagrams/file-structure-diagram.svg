  <path d="M 430 110 L 430 135 L 330 135 L 330 155" stroke="#4D7C54" stroke-width="1.8" fill="none"/>
  <path d="M 430 110 L 430 135 L 530 135 L 530 155" stroke="#4D7C54" stroke-width="1.8" fill="none"/>
  <path d="M 430 110 L 430 135 L 730 135 L 730 155" stroke="#C26D38" stroke-width="1.8" fill="none"/>

