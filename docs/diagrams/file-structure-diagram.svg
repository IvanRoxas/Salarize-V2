    <text x="14" y="22" font-size="11.5" font-weight="600" fill="#6E2800">schema.prisma</text>
  </g>
  <path d="M 730 239 L 730 250" stroke="#C26D38" stroke-width="1.4"/>
  <g transform="translate(640, 250)">
