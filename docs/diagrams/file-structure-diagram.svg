  </g>
  <path d="M 130 191 L 130 205" stroke="#D97706" stroke-width="1.4"/>
  <g transform="translate(40, 205)">
    <rect x="0" y="0" width="180" height="34" rx="5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2" filter="url(#shadow-clean)"/>
    <text x="14" y="22" font-size="11.5" font-weight="600" fill="#92400E">(auth) /</text>
  </g>
  <path d="M 130 239 L 130 250" stroke="#D97706" stroke-width="1.4"/>
